<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TravelHub">
  <!-- Location pin (navy) with 9-style hole -->
  <path fill-rule="evenodd" clip-rule="evenodd"
    d="M54 20 C40 20 29 31 29 45 C29 63 54 92 54 92 C54 92 79 63 79 45 C79 31 68 20 54 20 Z
       M54 32 A12 12 0 1 0 54 56 A12 12 0 1 0 54 32 Z"
    fill="#1f3a5f"/>
  <!-- Orange orbit swoosh -->
  <path d="M30 74 C18 64 24 48 46 47 C66 46 80 50 94 39"
    stroke="#ff8c42" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Swoosh tail curl (bottom-left) -->
  <path d="M33 79 C27 73 30 66 38 68" stroke="#ff8c42" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Airplane taking off (navy paper plane) -->
  <path transform="translate(60 2) scale(1.5)"
    d="M22 2 L15 22 L11 13 L2 9 Z" fill="#1f3a5f"/>
  <!-- speed mark -->
  <path d="M64 44 L74 39" stroke="#ff8c42" stroke-width="4" stroke-linecap="round"/>
</svg>
