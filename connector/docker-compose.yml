# تشغيل موصّل TravelHub على خادم (Oracle Cloud / أي VPS) عبر Docker.
# الاستخدام:  docker compose up -d --build
# المتغيّرات تُقرأ من ملف .env بجانب هذا الملف.
services:
  connector:
    build: .
    container_name: travelhub-connector
    restart: always          # يعيد التشغيل تلقائياً عند أي تعطّل أو إعادة إقلاع الخادم
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    mem_limit: 3g            # حدّ ذاكرة آمن (المتصفحات)
    shm_size: 1g            # ذاكرة مشتركة كافية لـ Chromium
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
